application {
  # deprecated, use 'environment' instead
  env=dev
  environment="development"
  version="1.0"
  name="proteus"
  path="/v1"
  host="localhost"
  ports {
    http=8090
   # https=8443
  }
  charset="UTF-8"
  fallbackHandler="io.sinistral.proteus.server.handlers.ServerFallbackHandler"
  defaultResponseListener="io.sinistral.proteus.server.handlers.ServerDefaultResponseListener"
  jacksonModule="io.sinistral.proteus.modules.JacksonModule"
  xmlModule="io.sinistral.proteus.modules.XmlModule"
  tmpdir=${java.io.tmpdir}/${application.name}
  # path to default favicon file
  favicon="/io/sinistral/proteus/favicon.ico"
  services {
    timeout=2 minutes
  }
}

proteus {
  # JWT Security Configuration
  security {
    jwt {
      # Clock skew tolerance for time-based validations (seconds)
      clockSkewToleranceSeconds=30

      # Whether to require expiration claim in tokens
      expirationRequired=true

      # Whether to require issuer claim in tokens
      issuerRequired=false

      # Whether to require audience claim in tokens
      audienceRequired=false

      # Maximum allowed token age in seconds (0 = no limit)
      maxTokenAgeSeconds=0

      # Whether signature verification is required
      signatureVerificationRequired=true

      # JWS algorithms accepted for authentication
      allowedAlgorithms=["RS256", "ES256", "HS256"]

      # Allowed token issuers (empty = allow all). When verification keys are
      # configured, at most one issuer is supported so keys cannot cross trust domains.
      allowedIssuers=[]

      # List of allowed token audiences (empty = allow all)
      allowedAudiences=[]

      # RSA public keys for signature verification
      rsa {
        # File paths to RSA public keys (supports classpath: prefix)
        publicKeys=[]

        # Inline PEM-encoded RSA public keys
        publicKeysPem=[]
      }

      # EC public keys for signature verification
      ec {
        # File paths to EC public keys (supports classpath: prefix)
        publicKeys=[]
      }

      # HMAC secrets for signature verification
      hmac {
        # Inline plain-text HMAC secrets (encoded as UTF-8 bytes)
        secrets=[]

        # Inline base64-encoded HMAC secrets
        secretsBase64=[]

        # File paths to HMAC secret files
        secretFiles=[]
      }
    }
  }

}

api.version="v1"

globalHeaders
{
#  Access-Control-Allow-Origin: "*"
#  Access-Control-Allow-Methods: "*"
#  Access-Control-Allow-Headers: "*"
  Server=${application.name}
}

health {
  statusPath="/health"
}

assets {
  # the base path assets will be server from
  path="/public"
  # the directory to load the assets from
  dir="./assets"
  cache {
    # cache timeout for the assets
    time=500
  }
}


openapi {

  basePath= ${application.path}"/openapi"

  redocPath= "redoc"

  specFilename="openapi"

  # openapi info
  info {
    title=${application.name}
    version=${application.version}
    description="Proteus Server"
  }

  securitySchemes {
    ApiKeyAuth={
     type="apiKey"
      in="header"
      name="X-API-KEY"
    }
  }

  servers=[
    {
      url=${application.path}
      description="Default Server"
    }
  ]

  converterClasses=[

  ]
}

jackson {

  jsonView={
    # a class that provides a mapping from the JsonView query parameter values to JsonView classes
    className=null
    # the name of the query parameter to use for JsonView class lookup
    queryParameterName="context"
  }

}

undertow
{
  # wrap the root handler in Undertow's graceful shutdown handler
  gracefulShutdown=true

  # refer to https://undertow.io/javadoc/2.0.x/io/undertow/UndertowOptions.html for details
  server {
    alwaysSetDate=true
    alwaysSetKeepAlive=false
    recordRequestStartTime=false
    maxEntitySize=512M
    enableHttp2=true,
    maxBufferedRequestSize=16384
  }

  # refer to https://docs.jboss.org/xnio/3.0/api/org/xnio/Options.html for details
  socket {
    backlog=10000
    reuseAddresses=true
    readTimeout=90000
    writeTimeout=90000
  }


  ssl {
      enabled=false
      keystorePath="development.jks"
      truststorePath="development.ts"
      keystorePassword="password"
      truststorePassword="password"
  }

  # x AvailableProcessors
  ioThreadsMultiplier=2
  workerThreadsMultiplier=10
  bufferSize=16k
  directBuffers=true
}
